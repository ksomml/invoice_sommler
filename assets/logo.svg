<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F62FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B2A4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A506B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F62FE" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Frame -->
  <polygon points="200,25 350,112 350,288 200,375 50,288 50,112" 
           fill="#F4F7FB" stroke="url(#grad1)" stroke-width="8" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Inner Hexagon Frame -->
  <polygon points="200,65 315,132 315,268 200,335 85,268 85,132" 
           fill="none" stroke="#D0D7E2" stroke-width="2" stroke-dasharray="6,6" stroke-linejoin="round"/>

  <!-- Robotics / Kinematics Joint Central Core -->
  <circle cx="200" cy="200" r="48" fill="url(#grad2)" stroke="url(#grad1)" stroke-width="6"/>
  <circle cx="200" cy="200" r="22" fill="#FFFFFF"/>
  <circle cx="200" cy="200" r="10" fill="url(#grad1)"/>

  <!-- Articulated Links / Nodes -->
  <!-- Top Node -->
  <line x1="200" y1="152" x2="200" y2="90" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="90" r="18" fill="url(#grad1)"/>
  <circle cx="200" cy="90" r="8" fill="#FFFFFF"/>

  <!-- Bottom-Left Node -->
  <line x1="158" y1="224" x2="105" y2="255" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="105" cy="255" r="18" fill="url(#grad1)"/>
  <circle cx="105" cy="255" r="8" fill="#FFFFFF"/>

  <!-- Bottom-Right Node -->
  <line x1="242" y1="224" x2="295" y2="255" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="295" cy="255" r="18" fill="url(#grad1)"/>
  <circle cx="295" cy="255" r="8" fill="#FFFFFF"/>

  <!-- Embedded Circuit Traces & Micro-Pads -->
  <path d="M 200,90 L 260,125 L 290,125" fill="none" stroke="#6C7A89" stroke-width="3" stroke-linecap="round"/>
  <circle cx="290" cy="125" r="5" fill="#6C7A89"/>

  <path d="M 105,255 L 105,185 L 140,165" fill="none" stroke="#6C7A89" stroke-width="3" stroke-linecap="round"/>
  <circle cx="140" cy="165" r="5" fill="#6C7A89"/>

  <path d="M 295,255 L 255,278 L 200,310" fill="none" stroke="#6C7A89" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="310" r="5" fill="#6C7A89"/>
</svg>
